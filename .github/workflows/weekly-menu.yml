name: Startup Campus Menu

on:
  schedule:
    - cron: "30 1 * * 1-5"
  workflow_dispatch:
    inputs:
      force_post:
        description: "Post even if the menu has not changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  post-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mirror menu image
        run: python scripts/post_menu.py --mirror-only
        env:
          MENU_TIMEZONE: Asia/Seoul
          MENU_IMAGE_DIR: docs/menus
          MENU_IMAGE_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/master/docs/menus"
          MENU_RESULT_PATH: .menu-state/current-menu-result.json

      - name: Save menu image mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d docs/menus ]; then
            git add docs/menus
          fi
          git diff --cached --quiet || git commit -m "Update menu image mirror"
          git push

      - name: Verify mirrored image URL
        run: |
          image_url=$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path(".menu-state/current-menu-result.json").read_text(encoding="utf-8"))
          print(data.get("image_url") or "")
          PY
          )
          if [ -n "$image_url" ]; then
            curl --fail --location --retry 5 --retry-delay 2 --output /dev/null "$image_url"
          fi

      - name: Post menu to Slack
        run: python scripts/post_menu.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MENU_TIMEZONE: Asia/Seoul
          MENU_IMAGE_DIR: docs/menus
          MENU_IMAGE_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/master/docs/menus"
          MENU_RESULT_PATH: .menu-state/current-menu-result.json
          FORCE_POST: ${{ inputs.force_post }}

      - name: Save notification state
        if: always()
        run: |
          if [ ! -f .menu-state/startupcampus-menu.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .menu-state/startupcampus-menu.json
          git diff --cached --quiet || git commit -m "Update menu notification state"
          git push
